<!-- {"title": "Workout complete", "stage": 2, "tab": null, "caption": "Celebrate, show a personal record, collect a difficulty rating for the next plan."} -->
<div class="center" style="margin-top:44px">
  <div style="width:96px;height:96px;border-radius:999px;margin:0 auto;background:var(--ember-grad);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,91,31,.12),0 0 0 28px rgba(255,91,31,.06)">{{i:check:48}}</div>
  <div class="h1 mt32">Workout complete</div>
  <div class="body mt8">Lower Hypertrophy · Week 1, Day 3</div>
</div>
<div class="row gap12 mt24">
  <div class="stat"><div class="l">Time</div><div class="v">44:12</div></div>
  <div class="stat"><div class="l">Volume</div><div class="v">3,240<span class="cap"> kg</span></div></div>
</div>
<div class="row gap12 mt12">
  <div class="stat"><div class="l">Sets</div><div class="v">18 / 18</div></div>
  <div class="stat"><div class="l">Streak</div><div class="v row gap6"><span class="ember">{{i:flame:22}}</span>6 days</div></div>
</div>
<div class="card row gap12 mt12" style="border-color:rgba(52,211,153,.4);background:var(--green-soft)">
  <span class="green">{{i:trophy:24}}</span><div class="grow"><div class="h3" style="font-size:15px">New personal record</div><div class="cap">Romanian deadlift · 40 kg × 10</div></div>
</div>
<div class="h3 mt20">How did today feel?</div>
<div class="row gap8 mt12"><span class="chip">Too easy</span><span class="chip on">Just right</span><span class="chip">Too hard</span></div>
<div class="footer"><div class="row gap12"><div class="btn btn-ghost" style="width:120px">{{i:share:18}} Share</div><div class="btn btn-primary grow">Done</div></div></div>
