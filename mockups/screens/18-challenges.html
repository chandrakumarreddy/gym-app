<!-- {"title": "Challenges", "stage": 3, "tab": "community", "caption": "Monthly challenges and a leaderboard give a reason to open the app on rest days.", "pay": "Coach-led challenges are Premium."} -->
<div class="row between" style="padding:4px 0 14px"><div class="h1">Challenges</div><span class="icon-btn round">{{i:users:20}}</span></div>
<div class="art v4" style="height:200px">
  {{fig:pushup}}
  <div class="on-art tl"><span class="pill ember">Joined</span></div>
  <div class="on-art tr"><span class="pill">{{i:clock:12}} 12 days left</span></div>
  <div class="on-art bl">
    <div class="h2">October push-up ladder</div>
    <div class="row between mt8 cap" style="color:rgba(255,255,255,.85)"><span>You: 620 / 1,000 reps</span><span>62%</span></div>
    <div class="meter mt8" style="background:rgba(255,255,255,.2)"><i style="width:62%;background:#fff"></i></div>
  </div>
</div>
<div class="tabs-u mt20"><span class="on">Leaderboard</span><span>Friends</span><span>Badges</span></div>
<div class="stack gap4 mt12">
  <div class="lb"><span class="rank gold">1</span><span class="avatar sm alt">RV</span><span class="grow">Riya V.</span><span class="num">1,000</span></div>
  <div class="lb"><span class="rank">2</span><span class="avatar sm">DS</span><span class="grow">Dev S.</span><span class="num">940</span></div>
  <div class="lb"><span class="rank">3</span><span class="avatar sm alt2">MK</span><span class="grow">Meera K.</span><span class="num">875</span></div>
  <div class="lb me"><span class="rank ember">14</span><span class="avatar sm">AK</span><span class="grow">You</span><span class="num">620</span></div>
</div>
<div class="card row gap12 mt16" style="border-color:rgba(255,192,72,.35)">
  <div class="art v2" style="width:56px;height:56px;flex:none">{{fig:stretch}}</div>
  <div class="grow"><div class="h3" style="font-size:15px">21-day core with Coach Priya</div><div class="cap">Starts Monday</div></div>
  <span class="pro">{{i:crown:12}} PRO</span>
</div>
